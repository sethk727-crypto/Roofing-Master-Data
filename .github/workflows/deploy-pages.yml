name: Publish to GitHub Pages

# Mirrors main to the gh-pages branch, which GitHub Pages serves.
# (The workflow token cannot create a Pages site via the API, so we use
# branch-based publishing — creating gh-pages enables Pages automatically.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
